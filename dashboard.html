<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="i18n.js?v=13"></script>
    <script src="sound.js?v=13"></script>
    <script src="shared.js?v=13"></script>
    <script src="dashboard.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <!-- Sidebar -->
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header style="margin-bottom: 30px;">
            <h1 style="font-size:32px; font-weight:800; color:#fff;" id="dashboard-date">Today</h1>
            <div style="font-size:14px; color:var(--text-muted);">LifeOS Overview</div>
        </header>

        <main class="view-section active" style="flex-direction: column;">
            
            <!-- Life Score Card -->
            <div class="glass-panel" style="padding: 40px; text-align: center; margin-bottom: 30px; background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.15), rgba(var(--accent-dark-rgb), 0.3)); border: 1px solid rgba(var(--accent-rgb), 0.4); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
                <h2 style="font-size: 20px; color: var(--accent-light); margin-bottom: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Life Score</h2>
                
                <div style="position: relative; display: inline-block;">
                    <div id="life-score-display" style="font-size: 84px; font-weight: 800; color: #fff; text-shadow: 0 0 30px rgba(var(--accent-rgb), 0.6); line-height: 1; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);">
                        0<span style="font-size: 32px; color: rgba(255,255,255,0.4); font-weight: 600;">/100</span>
                    </div>
                </div>
                
                <!-- Breakdown -->
                <div id="life-score-breakdown" style="display: flex; justify-content: center; gap: 12px; margin-top: 30px; flex-wrap: wrap;">
                    <!-- Will be populated by dashboard.js -->
                </div>
            </div>
            
            <!-- Daily Habit Checklist -->
            <div class="glass-panel" style="padding: 24px; margin-bottom: 30px;">
                <h3 style="font-size: 16px; color:#fff; margin-bottom: 20px; display:flex; align-items:center; gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Today's Habits
                </h3>
                <div id="dashboard-habits-list" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Will be populated by dashboard.js -->
                </div>
                <div style="margin-top: 15px; font-size: 12px; color: var(--text-muted);">
                    (Manage your habits in the <a href="goals.html" style="color:var(--accent); text-decoration:none;">Goals</a> section)
                </div>
            </div>
            
            <div style="display: flex; gap: 24px; flex-wrap: wrap;">
                <!-- Gamification: Heatmap -->
                <div class="glass-panel" style="padding: 24px; flex: 2; min-width: 300px;">
                    <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
                        <h3 style="font-size: 16px; color:#fff;">Contribution Heatmap</h3>
                        <div style="font-size: 12px; color:var(--text-muted);" id="heatmap-streak">0 Day Streak</div>
                    </div>
                    <div id="heatmap-container" style="display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; overflow-x: auto; padding-bottom: 10px;">
                        <!-- Generated by JS -->
                    </div>
                    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 15px; font-size: 11px; color: var(--text-muted);">
                        <span>Less</span>
                        <div style="width:12px; height:12px; border-radius:3px; background: rgba(255,255,255,0.05);"></div>
                        <div style="width:12px; height:12px; border-radius:3px; background: rgba(var(--accent-rgb), 0.3);"></div>
                        <div style="width:12px; height:12px; border-radius:3px; background: rgba(var(--accent-rgb), 0.6);"></div>
                        <div style="width:12px; height:12px; border-radius:3px; background: rgba(var(--accent-rgb), 1);"></div>
                        <span>More</span>
                    </div>
                </div>
                
                <!-- AI Coach Placeholder -->
                <div class="glass-panel" style="padding: 24px; flex: 1; min-width: 250px; border-left: 4px solid var(--accent);">
                    <h3 style="font-size: 16px; color:#fff; margin-bottom: 15px; display:flex; align-items:center; gap:8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path></svg>
                        AI Insights
                    </h3>
                    <div id="ai-insight-text" style="font-size: 14px; color: var(--text-muted); line-height: 1.5;">
                        Analyzing your daily habits and scores...
                    </div>
                </div>
            </div>
            
        </main>
    </div>
</body>
</html>
