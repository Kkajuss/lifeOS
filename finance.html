<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS - Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="i18n.js?v=13"></script>
    <script src="shared.js?v=13" defer></script>
    <script src="finance.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header class="view-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div style="flex:1;">
                <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin:0 0 5px 0;">Finance Tracker</h1>
                <div style="font-size: 14px; color: var(--text-muted);">Manage your income and expenses effortlessly.</div>
            </div>
            
            <div class="glass-panel" style="padding: 15px 24px; min-width:200px;">
                <div style="font-size:12px; color:var(--text-muted); text-transform:uppercase; font-weight:700; letter-spacing:1px; margin-bottom:5px;">Total Balance</div>
                <div style="font-size:28px; font-weight:800; color:#fff;" id="total-balance">$0.00</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="view-section active" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; overflow-y:auto; padding-bottom:50px;">
            
            <!-- Add Transaction Panel -->
            <div class="glass-panel" style="padding: 24px;">
                <h2 style="font-size: 18px; color:#fff; font-weight:700; margin:0 0 20px 0;">Add Transaction</h2>
                
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn" id="btn-type-expense" style="flex:1; background:rgba(239, 68, 68, 0.2); border-color:rgba(239, 68, 68, 0.5); color:#ef4444;" onclick="setTxType('expense')">Expense</button>
                    <button class="btn" id="btn-type-income" style="flex:1; background:transparent; border-color:rgba(255,255,255,0.1); color:var(--text-muted);" onclick="setTxType('income')">Income</button>
                </div>

                <div class="input-group">
                    <label>Amount ($)</label>
                    <input type="number" id="tx-amount" class="input-field" placeholder="0.00" step="0.01">
                </div>
                
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="tx-desc" class="input-field" placeholder="e.g., Groceries, Salary">
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select id="tx-category" class="input-field">
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills & Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health & Fitness</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <button class="btn" style="width:100%; justify-content:center; margin-top:10px;" onclick="addTransaction()">+ Add Transaction</button>
            </div>

            <!-- Recent Transactions Panel -->
            <div class="glass-panel" style="padding: 24px; display:flex; flex-direction:column; max-height: 500px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                    <h2 style="font-size: 18px; color:#fff; font-weight:700; margin:0;">Recent Transactions</h2>
                    <button class="btn" style="background:transparent; border:none; color:var(--text-muted); font-size:12px; padding:0;" onclick="clearTransactions()">Clear All</button>
                </div>
                
                <div id="tx-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:5px;">
                    <!-- Items rendered here -->
                </div>
            </div>

        </main>
    </div>
</body>
</html>
