<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÄŸÅ¸Å’Å¸ LifeOS - Study & Lessons</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="https://cdn.jsdelivr.net/npm/chart.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <!-- Sidebar -->
        <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <header class="top-stats">
            <div class="stat-box glass-panel" style="flex:0.5;">
                <div class="stat-label" data-i18n="month">Month</div>
                <div class="stat-value" id="current-month-display">January</div>
            </div>
            <div class="stat-box glass-panel">
                <div class="stat-label">Overall Success Rate</div>
                <div class="stat-value" id="avg-success" style="color:var(--accent-light);">0%</div>
            </div>
        </header>

        <!-- STUDY TRACKER VIEW -->
        <main class="view-section active" style="flex-direction: column;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h2 style="font-size:24px; font-weight:700; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">Study & Lessons Analysis</h2>
                <button class="add-btn" onclick="openModal('study-modal')">+ Log Test</button>
            </div>

            <!-- Pomodoro Timer -->
            <div class="glass-panel" style="padding: 24px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.1), rgba(var(--accent-dark-rgb), 0.2)); border-color: rgba(var(--accent-rgb), 0.3);">
                <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--accent-light);">Pomodoro Focus Timer</h3>
                <div id="pomodoro-time" style="font-size: 64px; font-weight: 800; font-family: monospace; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);">25:00</div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="pomodoro-start" class="qp-btn" style="background: var(--accent); padding: 8px 24px; font-weight: 600; border-radius: 20px;">Start</button>
                    <button id="pomodoro-pause" class="qp-btn" style="background: transparent; border: 1px solid var(--accent); padding: 8px 24px; font-weight: 600; border-radius: 20px;" disabled>Pause</button>
                    <button id="pomodoro-reset" class="qp-btn" style="background: rgba(255,255,255,0.1); padding: 8px 24px; font-weight: 600; border-radius: 20px;">Reset</button>
                </div>
                <div style="margin-top: 15px; font-size: 12px; color: var(--text-muted); display:flex; gap:15px; align-items: center;">
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="radio" name="pomodoro-mode" value="focus" checked> Focus: 
                        <input type="number" id="pomodoro-focus-input" value="25" min="1" max="120" style="width:50px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px; border-radius:4px; text-align:center; font-family:inherit;"> m
                    </label>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="radio" name="pomodoro-mode" value="break"> Break: 
                        <input type="number" id="pomodoro-break-input" value="5" min="1" max="60" style="width:50px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px; border-radius:4px; text-align:center; font-family:inherit;"> m
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 30px; margin-bottom: 30px;">
                <!-- Table -->
                <div class="spreadsheet-wrapper glass-panel" style="flex: 2; padding: 24px; min-height:400px;">
                    <h3 style="font-size:18px; margin-bottom:20px;">Test History</h3>
                    <table class="qp-table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th style="text-align:left; padding:12px;">Subject/Topic</th>
                                <th>Correct</th>
                                <th>Wrong</th>
                                <th>Success %</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="study-table-body"></tbody>
                    </table>
                </div>

                <!-- Doughnut Chart -->
                <div class="glass-panel" style="flex: 1; padding: 24px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                    <h3 style="font-size:16px; margin-bottom:20px; color:#fff;">Overall Correct vs Wrong</h3>
                    <div style="position:relative; width:100%; max-width:250px; aspect-ratio:1;">
                        <canvas id="studyChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="study-modal">
        <div class="modal-content">
            <h3>Log Test Results</h3>
            <form id="study-form">
                <input type="date" id="study-date" required class="qp-input">
                <input type="text" id="study-subject" required class="qp-input" placeholder="Subject (e.g., Math, Physics)">
                <input type="number" id="study-correct" required min="0" class="qp-input" placeholder="Correct Answers (e.g., 35)">
                <input type="number" id="study-wrong" required min="0" class="qp-input" placeholder="Wrong Answers (e.g., 5)">
                <button type="submit" class="qp-btn">Save</button>
                <button type="button" class="qp-btn qp-btn-cancel" onclick="closeModal('study-modal')">Cancel</button>
            </form>
        </div>
    </div>

    <script src="i18n.js?v=13"></script>
    <script src="sound.js?v=13"></script>
    <script src="shared.js?v=13"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js?v=13"></script>
    <script src="study.js?v=13"></script>
</body>
</html>
