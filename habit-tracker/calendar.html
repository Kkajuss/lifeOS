<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS - Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="i18n.js?v=13"></script>
    <script src="shared.js?v=13" defer></script>
    <script src="calendar.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header class="view-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin:0 0 5px 0;">Calendar</h1>
                <div style="font-size: 14px; color: var(--text-muted);">View your habit history and daily consistency.</div>
            </div>
            <div class="glass-panel" style="padding:10px 20px; display:flex; gap:15px; align-items:center;">
                <button onclick="changeMonth(-1)" style="background:transparent; border:none; color:#fff; cursor:pointer; font-size:18px;">&larr;</button>
                <div id="current-month-year" style="font-weight:700; color:#fff; font-size:16px; min-width:120px; text-align:center;">Month 2026</div>
                <button onclick="changeMonth(1)" style="background:transparent; border:none; color:#fff; cursor:pointer; font-size:18px;">&rarr;</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="view-section active" style="display:flex; flex-direction:column; gap: 24px; overflow-y:auto; padding-bottom:50px;">
            
            <div class="glass-panel" style="padding:24px;">
                <!-- Days of Week Header -->
                <div style="display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; margin-bottom:15px; font-weight:700; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:1px;">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                
                <!-- Calendar Grid -->
                <div id="calendar-grid" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:10px;">
                    <!-- Days rendered here -->
                </div>
            </div>

            <!-- Day Details Panel -->
            <div class="glass-panel" id="day-details" style="padding:24px; display:none;">
                <h3 style="margin:0 0 15px 0; color:#fff; font-size:18px;" id="selected-date-title">Selected Date</h3>
                
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:200px;">
                        <h4 style="color:var(--accent); margin:0 0 10px 0; font-size:14px;">Habits Completed</h4>
                        <ul id="day-habits-list" style="margin:0; padding-left:20px; color:#fff; font-size:14px; line-height:1.8;"></ul>
                    </div>
                    
                    <div style="flex:1; min-width:200px;">
                        <h4 style="color:#10b981; margin:0 0 10px 0; font-size:14px;">Daily Life Score</h4>
                        <div id="day-life-score" style="font-size:36px; font-weight:800; color:#fff;">0</div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
