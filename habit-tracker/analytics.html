<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS - Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="https://cdn.jsdelivr.net/npm/chart.js?v=13"></script>
    <script src="i18n.js?v=13"></script>
    <script src="shared.js?v=13" defer></script>
    <script src="analytics.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header class="view-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin:0 0 5px 0;">Analytics</h1>
                <div style="font-size: 14px; color: var(--text-muted);">Deep insights into your life OS.</div>
            </div>
            
            <div style="display:flex; gap:10px;">
                <button id="btn-7d" class="btn" style="background:var(--panel-bg); color:#fff; border:1px solid rgba(255,255,255,0.1);" onclick="renderCharts('7d')">7 Days</button>
                <button id="btn-30d" class="btn" style="background:var(--accent); color:#fff; border:none; box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.4);" onclick="renderCharts('30d')">30 Days</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="view-section active" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; overflow-y:auto; padding-bottom:50px;">
            
            <!-- Life Score Trend -->
            <div class="glass-panel" style="padding:24px; display:flex; flex-direction:column; min-height: 300px;">
                <div style="margin-bottom:15px;">
                    <h3 style="margin:0 0 5px 0; color:#fff; font-size:18px;">Life Score Trend</h3>
                    <div style="font-size:12px; color:var(--text-muted);">Your overall daily score progression.</div>
                </div>
                <div style="flex:1; position:relative; min-height: 200px;">
                    <canvas id="lifeScoreChart"></canvas>
                </div>
            </div>

            <!-- Finance Overview -->
            <div class="glass-panel" style="padding:24px; display:flex; flex-direction:column; min-height: 300px;">
                <div style="margin-bottom:15px;">
                    <h3 style="margin:0 0 5px 0; color:#fff; font-size:18px;">Income vs Expenses</h3>
                    <div style="font-size:12px; color:var(--text-muted);">Financial breakdown for the period.</div>
                </div>
                <div style="flex:1; position:relative; min-height: 200px;">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
            
            <!-- Mood vs Productivity -->
            <div class="glass-panel" style="padding:24px; display:flex; flex-direction:column; min-height: 300px; grid-column: 1 / -1;">
                <div style="margin-bottom:15px;">
                    <h3 style="margin:0 0 5px 0; color:#fff; font-size:18px;">Mental State: Mood vs Productivity</h3>
                    <div style="font-size:12px; color:var(--text-muted);">How your mood correlates with how productive you feel.</div>
                </div>
                <div style="flex:1; position:relative; min-height: 250px;">
                    <canvas id="mentalChart"></canvas>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
