<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS - Goals</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="i18n.js?v=13"></script>
    <script src="shared.js?v=13" defer></script>
    <script src="goals.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header class="view-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin:0 0 5px 0;">Goals</h1>
                <div style="font-size: 14px; color: var(--text-muted);">Track your long-term objectives and milestones.</div>
            </div>
            <button class="btn" onclick="openModal('new-goal-modal')" style="background:var(--accent); color:#fff; border:none; box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.4);">
                + New Goal
            </button>
        </header>

        <!-- Main Content -->
        <main class="view-section active" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; overflow-y:auto; padding-bottom:50px;" id="goals-list">
            <!-- Goals rendered here -->
        </main>
    </div>

    <!-- New Goal Modal -->
    <div id="new-goal-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 500px; padding:30px;">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0; font-size:20px; color:#fff;">Create New Goal</h2>
                <button onclick="closeModal('new-goal-modal')" style="background:transparent; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
            </div>
            
            <div class="input-group" style="margin-bottom:15px;">
                <label>Goal Name</label>
                <input type="text" id="goal-name" class="input-field" placeholder="e.g., Read 50 Books">
            </div>
            
            <div class="input-group" style="margin-bottom:15px;">
                <label>Target Value</label>
                <input type="number" id="goal-target" class="input-field" placeholder="e.g., 50">
            </div>
            
            <div class="input-group" style="margin-bottom:25px;">
                <label>Unit (Optional)</label>
                <input type="text" id="goal-unit" class="input-field" placeholder="e.g., books, kg, miles">
            </div>

            <button class="btn" onclick="saveGoal()" style="width:100%; justify-content:center; background:var(--accent); color:#fff; border:none;">Create Goal</button>
        </div>
    </div>
</body>
</html>
