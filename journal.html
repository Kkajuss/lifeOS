<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS - Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="i18n.js?v=13"></script>
    <script src="shared.js?v=13" defer></script>
    <script src="journal.js?v=13" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=13"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js?v=13"></script>
    <script src="firebase-sync.js?v=13" defer></script>
</head>
<body class="fade-in">
    <aside class="sidebar" id="top-bar"></aside>

    <div class="app-container">
        <!-- Header -->
        <header class="view-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom: 30px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin:0 0 5px 0;" data-i18n="journal">Journal</h1>
                <div style="font-size: 14px; color: var(--text-muted);" data-i18n="journal_desc">Reflect on your day, thoughts, and ideas.</div>
            </div>
            <button class="btn" onclick="openModal('new-entry-modal')" style="background:var(--accent); color:#fff; border:none; box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.4);" data-i18n="new_entry">
                + New Entry
            </button>
        </header>

        <!-- Main Content -->
        <main class="view-section active" style="display:flex; flex-direction:column; gap: 24px; overflow-y:auto; padding-bottom:50px; padding-right:15px;">
            
            <div id="journal-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; padding-right:10px;">
                <!-- Entries rendered here -->
            </div>

        </main>
    </div>

    <!-- New Entry Modal -->
    <div id="new-entry-modal" class="modal-overlay">
        <div class="modal glass-panel" style="max-width: 600px; padding:30px;">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0; font-size:20px; color:#fff;" data-i18n="new_journal_entry">New Journal Entry</h2>
                <button onclick="closeModal('new-entry-modal')" style="background:transparent; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
            </div>
            
            <div class="input-group" style="margin-bottom:15px;">
                <input type="text" id="entry-title" class="input-field" placeholder="Title" data-i18n="entry_title_placeholder" style="font-size:16px; font-weight:600;">
            </div>
            
            <div class="input-group" style="margin-bottom:20px;">
                <textarea id="entry-content" class="input-field" rows="8" placeholder="Write your thoughts here..." data-i18n="entry_content_placeholder" style="resize:vertical; font-family:inherit; font-size:14px; line-height:1.6;"></textarea>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; gap:10px;">
                    <button class="btn" style="background:rgba(255,255,255,0.05); padding:8px 12px;" onclick="addTag('Idea')">💡 <span data-i18n="tag_idea">Idea</span></button>
                    <button class="btn" style="background:rgba(255,255,255,0.05); padding:8px 12px;" onclick="addTag('Gratitude')">🙏 <span data-i18n="tag_gratitude">Gratitude</span></button>
                    <button class="btn" style="background:rgba(255,255,255,0.05); padding:8px 12px;" onclick="addTag('Vent')">🤬 <span data-i18n="tag_vent">Vent</span></button>
                </div>
                <button class="btn" onclick="saveEntry()" style="background:var(--accent); color:#fff; border:none;" data-i18n="save_entry">Save Entry</button>
            </div>
            <div id="active-tags" style="display:flex; gap:5px; margin-top:10px; font-size:12px; color:var(--accent);"></div>
        </div>
    </div>

    <!-- View Entry Modal -->
    <div id="view-entry-modal" class="modal-overlay">
        <div class="modal glass-panel" style="max-width: 600px; padding:30px;">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="view-entry-title" style="margin:0; font-size:20px; color:#fff; word-break: break-word;"></h2>
                <div style="display:flex; align-items:center; gap: 15px;">
                    <button id="view-entry-delete-btn" style="background:rgba(239, 68, 68, 0.1); color:#ef4444; border:none; padding: 6px 12px; border-radius: 6px; cursor:pointer; font-weight: 600; font-size: 13px; transition:0.2s;" onmouseover="this.style.background='rgba(239, 68, 68, 0.2)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'">Delete</button>
                    <button onclick="closeModal('view-entry-modal')" style="background:transparent; border:none; color:var(--text-muted); font-size:24px; cursor:pointer;">&times;</button>
                </div>
            </div>
            <div id="view-entry-date" style="font-size:12px; color:var(--text-muted); margin-bottom:15px;"></div>
            <div id="view-entry-content" style="font-size:15px; color:#d1d5db; line-height:1.6; word-break: break-word; margin-bottom: 20px;"></div>
            <div id="view-entry-tags" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
        </div>
    </div>
</body>
</html>
